name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/writefreely
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build IMAGE=${IMAGE,,}
        shell: bash

      - name: Smoke test
        run: make test IMAGE=${IMAGE,,}
        shell: bash

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: make push IMAGE=${IMAGE,,}
        shell: bash
